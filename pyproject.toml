[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywaveshare"
version = "0.1.0"
description = "Safe Python SDK for Waveshare Ethernet relays and ZLAN provisioning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Unique Security" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
pywaveshare = "pywaveshare.cli:main"

[project.urls]
Homepage = "https://github.com/dannielperez/pywaveshare"
Issues = "https://github.com/dannielperez/pywaveshare/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pywaveshare"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pywaveshare"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pywaveshare"]
